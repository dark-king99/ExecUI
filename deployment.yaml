# ═══════════════════════════════════════════════════════════════════════════════
#  ExecUI  ·  Kubernetes Deployment
#
#  Resources (top-to-bottom):
#    1. Namespace
#    2. Secret          – DATABASE_URL, JWT_SECRET
#    3. ConfigMap       – non-sensitive runtime config
#    4. Backend         – Deployment + Service (ClusterIP :5555)
#    5. Frontend        – Deployment + Service (ClusterIP :80)
#    6. Ingress         – routes all external traffic through the frontend;
#                         frontend nginx proxies /api/ → backend internally
#
#  Before applying:
#    • Replace the placeholder values in the Secret with real base64 values:
#        echo -n "postgresql://user:pass@host:5432/dbname" | base64
#        echo -n "your-long-jwt-secret" | base64
#    • Replace image references with your registry paths.
#
#  Apply:
#    kubectl apply -f deployment.yaml
# ═══════════════════════════════════════════════════════════════════════════════

# ── 1. Namespace ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: execui
  labels:
    app.kubernetes.io/name: execui

---

# ── 2. Secret ─────────────────────────────────────────────────────────────────
# Values must be base64-encoded.  Replace before deploying.
apiVersion: v1
kind: Secret
metadata:
  name: execui-secrets
  namespace: execui
type: Opaque
data:
  # echo -n "postgresql://postgres:password@postgres-svc:5432/execui" | base64
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBhc3N3b3JkQHBvc3RncmVzLXN2Yzo1NDMyL2V4ZWN1aQ==
  # echo -n "change-this-to-a-long-random-secret" | base64
  JWT_SECRET: Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXJhbmRvbS1zZWNyZXQ=

---

# ── 3. ConfigMap ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: execui-config
  namespace: execui
data:
  PORT: "5555"
  JWT_EXPIRES: "30d"
  NODE_ENV: "production"

---

# ── 4a. Backend Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: execui
  labels:
    app: backend
    app.kubernetes.io/name: execui
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Prevent both replicas landing on the same node
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: backend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: backend
          # Replace with your registry image, e.g. ghcr.io/your-org/execui-backend:1.0.0
          image: execui/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5555

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execui-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: execui-secrets
                  key: JWT_SECRET
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: execui-config
                  key: PORT
            - name: JWT_EXPIRES
              valueFrom:
                configMapKeyRef:
                  name: execui-config
                  key: JWT_EXPIRES
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: execui-config
                  key: NODE_ENV

          # Health checks against the /api/health route
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5555
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5555
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Don't expose secrets or env into crash dumps
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Prisma writes to /tmp at runtime
            runAsNonRoot: true
            runAsUser: 1000

---

# ── 4b. Backend Service ───────────────────────────────────────────────────────
# ClusterIP — only reachable inside the cluster (nginx proxies from frontend).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: execui
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5555
      targetPort: 5555
  type: ClusterIP

---

# ── 5a. Frontend Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: execui
  labels:
    app: frontend
    app.kubernetes.io/name: execui
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: frontend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: frontend
          # Replace with your registry image, e.g. ghcr.io/your-org/execui-frontend:1.0.0
          image: execui/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx writes pid/tmp files
            runAsNonRoot: false             # nginx requires root to bind port 80

---

# ── 5b. Frontend Service ──────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: execui
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP

---

# ── 6. Ingress ────────────────────────────────────────────────────────────────
# Requires an Ingress controller (e.g. ingress-nginx) in your cluster.
# All traffic enters via the frontend service; nginx inside the pod proxies
# /api/* to the backend ClusterIP service — no separate ingress rule needed
# for the API.
#
# To use TLS, add the tls: block and point to a cert-manager Certificate
# or a manually-created Secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: execui-ingress
  namespace: execui
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  # Uncomment and update for TLS / HTTPS:
  # tls:
  #   - hosts:
  #       - execui.example.com
  #     secretName: execui-tls
  rules:
    - # host: execui.example.com   ← uncomment and set your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
