server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Live notification stream (SSE) ────────────────────────────────────────
    # Must come before the generic /api/ block: the stream needs buffering OFF
    # and a long read timeout, or the bell's real-time updates silently die.
    # ^~ on the API prefixes: without it the static-asset REGEX below would
    # outrank these prefix matches and swallow e.g. /api/uploads/avatar.png.
    location ^~ /api/notifications/stream {
        proxy_pass         http://backend:5555;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # ── Proxy /api → backend service ─────────────────────────────────────────
    # "backend" resolves via Kubernetes DNS / Docker Compose service name.
    location ^~ /api/ {
        proxy_pass         http://backend:5555/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Attachments API accepts files up to 100 MB.
        client_max_body_size 100m;

        # Surface upstream errors as JSON so the frontend can parse them
        proxy_intercept_errors off;
    }

    # Backend health (used by uptime checks that enter via the web tier).
    location = /health {
        proxy_pass http://backend:5555/health;
    }

    # ── SPA routing ───────────────────────────────────────────────────────────
    # Every path that doesn't match a static asset falls through to index.html
    # so React Router handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}
